name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs only on PRs; pushes to main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: Shell (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          bash -n install.sh
          bash -n scripts/lint-frontmatter.sh
          bash -n scripts/drift-report.sh
          bash -n scripts/version.sh
      - name: shellcheck
        run: shellcheck install.sh scripts/lint-frontmatter.sh scripts/drift-report.sh scripts/version.sh

  frontmatter:
    name: Frontmatter de skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint de frontmatter
        run: bash scripts/lint-frontmatter.sh

  version:
    name: Versión semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # VERSION es la fuente; package.json y .codex-plugin/plugin.json la repiten.
      - name: VERSION válida y manifests sincronizados
        run: bash scripts/version.sh check
      # Cada PR sube VERSION un paso semver desde el branch base (patch, minor o
      # major). Si el base todavía no tiene VERSION, cuenta el último tag vX.Y.Z.
      - name: Salto semver desde el branch base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(bash scripts/version.sh base "origin/$BASE_REF")
          bash scripts/version.sh check --next-of "$base"

  tests:
    name: Tests de extensiones Pi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Si subís este pin, revisá los asserts de wording/comandos built-in en
      # pi-extensions/pi-package/pi-package.test.ts (test "native local
      # install..."): están acoplados a esta version exacta de Pi.
      - name: Instalar Pi 0.85.1 para probes del paquete
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.85.1
      - name: node --test
        run: node --test pi-extensions/*/*.test.ts

  harness-gate:
    name: Gate anti-drift de productores SDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: node --test (harness-gate)
        run: node --test pi-extensions/harness-gate/harness-gate.test.ts

  drift:
    name: Drift entre harnesses (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Reporte de drift
        continue-on-error: true
        run: bash scripts/drift-report.sh | tee -a "$GITHUB_STEP_SUMMARY"

  plugin-validate:
    name: Validar plugin de Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Pin: los chequeos de `validate` cambian entre versiones. Si lo subis,
      # reverifica `claude plugin validate .` y la fila del contrato.
      - name: Instalar Claude Code 2.1.294
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.294
          claude --version
      # Sin --strict: el warning de CLAUDE.md en la raiz del plugin es inevitable.
      # `validate` es estatico: no pide autenticacion ni llama a la API.
      - name: claude plugin validate
        run: |
          status=0
          out=$(claude plugin validate . 2>&1) || status=$?
          {
            echo '### claude plugin validate'
            echo '```'
            echo "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Cada push a main crea el tag v<VERSION> y su release con notas generadas
  # por GitHub, solo si pasaron los checks. Un re-run sobre el commit ya
  # tageado no hace nada; un push con codigo nuevo sin subir VERSION falla.
  # El grupo de concurrencia del workflow ya serializa los pushes a main; el
  # del job es defensa explicita por si ese grupo cambia. Si GitHub cancela un
  # run pendiente, el release siguiente acepta el salto y sus notas lo cubren.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shell, frontmatter, version, tests, harness-gate, plugin-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear tag y release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(bash scripts/version.sh plan-release "$GITHUB_SHA")
          v=${plan#* }
          if [ "${plan%% *}" = skip ]; then
            echo "v$v ya apunta a este commit: no hay release nuevo" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --generate-notes
          echo "Release v$v creado" | tee -a "$GITHUB_STEP_SUMMARY"
